  <rect class="elbl-bg" x="199.5" y="468" width="63.0" height="17" rx="4"/>
  <text class="elbl" x="231" y="480" text-anchor="middle">Rewrite</text>
  <path class="edge" d="M 429 326 L 456 326 L 456 113 L 488 113"/>
  <rect class="elbl-bg" x="431.5" y="173" width="49.0" height="17" rx="4"/>
  <text class="elbl" x="456" y="185" text-anchor="middle">Align</text>
  <path class="edge" d="M 779 108 L 837 108"/>
  <rect class="elbl-bg" x="766.0" y="83" width="84.0" height="17" rx="4"/>
  <text class="elbl" x="808" y="95" text-anchor="middle">Subprocess</text>
  <path class="edge" d="M 429 360 L 464 360 L 464 289 L 488 289"/>
  <rect class="elbl-bg" x="432.5" y="324" width="63.0" height="17" rx="4"/>
  <text class="elbl" x="464" y="336" text-anchor="middle">Z-Stack</text>
  <path class="edge" d="M 635 328 L 635 363"/>
  <rect class="elbl-bg" x="600.0" y="337" width="70.0" height="17" rx="4"/>
  <text class="elbl" x="635" y="349" text-anchor="middle">1st .tif</text>
  <path class="edge" d="M 635 428 L 635 465"/>
  <rect class="elbl-bg" x="603.5" y="438" width="63.0" height="17" rx="4"/>
  <text class="elbl" x="635" y="450" text-anchor="middle">AutoRun</text>
  <path class="edge" d="M 1020 134 L 1020 157"/>
  <path class="edge" d="M 1020 232 L 1020 255"/>
  <path class="edge" d="M 1020 332 L 1020 355"/>
  <path class="edge" d="M 1020 440 L 1020 473"/>
  <rect class="elbl-bg" x="981.5" y="448" width="77.0" height="17" rx="4"/>
  <text class="elbl" x="1020" y="460" text-anchor="middle">Open .xml</text>
  <path class="edge-green" d="M 635 550 L 635 610 L 175 610 L 175 766"/>
  <rect class="elbl-bg" x="307.5" y="598" width="175.0" height="17" rx="4"/>
  <text class="elbl" x="395" y="610" text-anchor="middle">Virtual Stack (Z-Stack)</text>
  <path class="edge-orange" d="M 920 548 L 920 644 L 395 644 L 395 766"/>
  <rect class="elbl-bg" x="543.0" y="632" width="224.0" height="17" rx="4"/>
  <text class="elbl" x="655" y="644" text-anchor="middle">2D Spatial Mosaic (Pass 1 + 3)</text>
  <path class="edge-red" d="M 1020 548 L 1020 680 L 845 680 L 845 766"/>
  <rect class="elbl-bg" x="814.5" y="668" width="231.0" height="17" rx="4"/>
  <text class="elbl" x="930" y="680" text-anchor="middle">Mosaic Z-Stack (Pass 1 + 2 + 3)</text>
  <path class="edge-dash" d="M 1110 548 L 1110 766"/>
  <rect class="elbl-bg" x="1047.0" y="632" width="126.0" height="17" rx="4"/>
  <text class="elbl" x="1110" y="644" text-anchor="middle">Saved .xml + Log</text>
