<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="950" viewBox="0 0 1240 950" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f0883e"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149"/>
    </marker>
    <style>
      .bg { fill: #0d1117; }
      .swim { fill: #161b22; stroke: #484f58; stroke-width: 1.6; rx: 8; }
      .swim-blue { fill: #161b22; stroke: #1f6feb; stroke-width: 2.2; rx: 8; }
      .swim-purple { fill: #161b22; stroke: #a371f7; stroke-width: 2.2; rx: 8; }
      .sub-dash { fill: none; stroke: #484f58; stroke-width: 1.3; stroke-dasharray: 4,3; rx: 6; }
      .sub-in { fill: #1c2128; stroke: #30363d; stroke-width: 1.3; rx: 6; }
      .box { fill: #21262d; stroke: #484f58; stroke-width: 1.4; rx: 6; }
      .cyl-blue { fill: #0d2b45; stroke: #58a6ff; stroke-width: 2; rx: 8; }
      .cyl-green { fill: #132e21; stroke: #2ecc71; stroke-width: 2; rx: 8; }
      .hdr { fill: #f0f6fc; font-size: 16px; font-weight: 700; }
      .hdr-blue { fill: #58a6ff; font-size: 16px; font-weight: 700; }
      .hdr-purple { fill: #d2a8ff; font-size: 16px; font-weight: 700; }
      .subhdr { fill: #8b949e; font-size: 13px; font-weight: 700; }
      .t-bold { fill: #f0f6fc; font-size: 14px; font-weight: 700; }
      .t-bold-sm { fill: #f0f6fc; font-size: 11.8px; font-weight: 700; }
      .t-sub { fill: #c9d1d9; font-size: 12.2px; }
      .edge { fill: none; stroke: #58a6ff; stroke-width: 2; marker-end: url(#arrow); }
      .edge-dash { fill: none; stroke: #58a6ff; stroke-width: 1.8; stroke-dasharray: 5,4; marker-end: url(#arrow); }
      .edge-green { fill: none; stroke: #3fb950; stroke-width: 2.2; marker-end: url(#arrow-green); }
      .edge-orange { fill: none; stroke: #f0883e; stroke-width: 2.2; stroke-dasharray: 6,4; marker-end: url(#arrow-orange); }
      .edge-red { fill: none; stroke: #f85149; stroke-width: 2.2; marker-end: url(#arrow-red); }
      .elbl-bg { fill: #0d1117; stroke: #30363d; stroke-width: 0.8; opacity: 0.96; }
      .elbl { fill: #e6edf3; font-size: 11.8px; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1240" height="950"/>
  <rect class="swim" x="20" y="20" width="430" height="560" />
  <text class="hdr" x="235" y="45" text-anchor="middle">1. Discovery, Sync &amp; Packaging</text>
  <rect class="sub-dash" x="32" y="66" width="192" height="498" />
  <text class="subhdr" x="128" y="86" text-anchor="middle">Storage &amp; Packages</text>
  <rect class="box" x="42" y="102" width="172" height="54" />
  <text class="t-bold" x="128" y="125" text-anchor="middle">MAPS Acquisition</text>
  <text class="t-sub" x="128" y="142" text-anchor="middle">Z-Stack / Mosaic / M-Z</text>
  <rect class="cyl-blue" x="46" y="194" width="164" height="70" />
  <text class="t-bold" x="128" y="224" text-anchor="middle">Network Storage</text>
  <text class="t-sub" x="128" y="241" text-anchor="middle">(I:/Maps)</text>
  <rect class="cyl-green" x="46" y="314" width="164" height="74" />
  <text class="t-bold" x="128" y="344" text-anchor="middle">Local Scratch SSD</text>
  <text class="t-sub" x="128" y="361" text-anchor="middle">(D:/&lt;Dataset&gt;)</text>
  <rect class="box" x="42" y="444" width="172" height="96" />
  <text class="t-bold" x="128" y="468" text-anchor="middle">Export Package</text>
  <text class="t-sub" x="128" y="485" text-anchor="middle">&lt;Pkg&gt;/images/, .xml,</text>
  <text class="t-sub" x="128" y="502" text-anchor="middle">mipmaps &amp; action.log</text>
  <rect class="sub-in" x="236" y="66" width="202" height="498" />
  <text class="subhdr" x="337" y="86" text-anchor="middle">Control &amp; Desktop UI</text>
  <rect class="box" x="245" y="102" width="184" height="54" />
  <text class="t-bold" x="337" y="125" text-anchor="middle">nas_indexer.py</text>
  <text class="t-sub" x="337" y="142" text-anchor="middle">--indexer (auto-restart)</text>
  <rect class="box" x="245" y="192" width="184" height="76" />
  <text class="t-bold-sm" x="337" y="214" text-anchor="middle">%APPDATA%/BioEM_Preview/</text>
  <text class="t-sub" x="337" y="231" text-anchor="middle">cache, aligned_datasets,</text>
  <text class="t-sub" x="337" y="248" text-anchor="middle">dataset_logs/</text>
  <rect class="box" x="245" y="308" width="184" height="82" />
  <text class="t-bold" x="337" y="332" text-anchor="middle">Preview_beta.exe</text>
  <text class="t-sub" x="337" y="349" text-anchor="middle">Badges, Logs Drawer,</text>
  <text class="t-sub" x="337" y="366" text-anchor="middle">Setup Wizard</text>
  <rect class="box" x="245" y="444" width="184" height="96" />
  <text class="t-bold" x="337" y="468" text-anchor="middle">Right-Click Menu</text>
  <text class="t-sub" x="337" y="485" text-anchor="middle">Show Folder | Align Z</text>
  <text class="t-sub" x="337" y="502" text-anchor="middle">Export Pkg | Refresh</text>
  <rect class="swim-purple" x="475" y="20" width="320" height="155" />
  <text class="hdr-purple" x="635" y="45" text-anchor="middle">2A. PyTorch Runtime (bioem_engine.py)</text>
  <rect class="box" x="491" y="68" width="288" height="90" />
  <text class="t-bold" x="635" y="93" text-anchor="middle">On-Demand uv Bootstrapper</text>
  <text class="t-sub" x="635" y="110" text-anchor="middle">Installs isolated CUDA / CPU PyTorch venv:</text>
  <text class="t-sub" x="635" y="127" text-anchor="middle">%LOCALAPPDATA%/BioEM_Preview/runtime/</text>
  <rect class="swim-blue" x="475" y="200" width="320" height="380" />
  <text class="hdr-blue" x="635" y="225" text-anchor="middle">2B. FEI LUT Check &amp; Z Routing</text>
  <rect class="box" x="491" y="250" width="288" height="78" />
  <text class="t-bold" x="635" y="274" text-anchor="middle">1st TIFF Check (bioem_config.py)</text>
  <text class="t-sub" x="635" y="291" text-anchor="middle">Tag 34682 DigitalContrast:</text>
  <text class="t-sub" x="635" y="308" text-anchor="middle">-1 = Keep LUT  |  +1 = Invert LUT</text>
  <rect class="box" x="505" y="366" width="260" height="62" />
  <text class="t-bold" x="635" y="392" text-anchor="middle">fiji_trigger.txt</text>
  <text class="t-sub" x="635" y="409" text-anchor="middle">...|z-stack|1|1|invert=0/1</text>
  <rect class="box" x="495" y="468" width="280" height="82" />
  <text class="t-bold" x="635" y="502" text-anchor="middle">BioEM_Watcher.ijm (AutoRun)</text>
  <text class="t-sub" x="635" y="519" text-anchor="middle">Virtual Stack + Conditional Invert LUT</text>
  <rect class="swim" x="820" y="20" width="400" height="560" />
  <text class="hdr" x="1020" y="45" text-anchor="middle">3. PyTorch GPU/CPU Aligner</text>
  <rect class="box" x="840" y="68" width="360" height="66" />
  <text class="t-bold" x="1020" y="94" text-anchor="middle">bioem_torch_align.py</text>
  <text class="t-sub" x="1020" y="111" text-anchor="middle">1st TIFF DigitalContrast &amp; grid (RxC, z=N)</text>
  <rect class="box" x="840" y="160" width="360" height="72" />
  <text class="t-bold" x="1020" y="189" text-anchor="middle">Pass 1: 2D Intra-Section Montaging</text>
  <text class="t-sub" x="1020" y="206" text-anchor="middle">Coarse-to-fine FFT (-dx, -dy) + IRLS/LSQR</text>
  <rect class="box" x="840" y="258" width="360" height="74" />
  <text class="t-bold" x="1020" y="288" text-anchor="middle">Pass 2: Sequential Z-Alignment</text>
  <text class="t-sub" x="1020" y="305" text-anchor="middle">Procrustes RANSAC (align_z_pair_rigid)</text>
  <rect class="box" x="840" y="358" width="360" height="82" />
  <text class="t-bold" x="1020" y="388" text-anchor="middle">Pass 3: Native TrakEM2 XML &amp; Logs</text>
  <text class="t-sub" x="1020" y="405" text-anchor="middle">filter_enabled/invert, int min/max + logs/</text>
  <rect class="box" x="865" y="476" width="310" height="72" />
  <text class="t-bold" x="1020" y="506" text-anchor="middle">Fiji (Java 8) / TrakEM2</text>
  <text class="t-sub" x="1020" y="523" text-anchor="middle">Direct Display, Mipmaps &amp; Inspection</text>
  <rect class="swim" x="20" y="720" width="1200" height="210" />
  <text class="hdr" x="620" y="746" text-anchor="middle">4. Supported Workflows &amp; Contextual Outputs</text>
  <rect class="box" x="40" y="769" width="270" height="144" style="fill:#142b22;stroke:#2ecc71;stroke-width:2;"/>
  <text class="t-bold" x="175" y="795" text-anchor="middle">Workflow 1: Z-Stack</text>
  <text class="t-sub" x="175" y="812" text-anchor="middle">(Single tile, serial sections)</text>
  <text class="t-sub" x="175" y="846" text-anchor="middle">Default: Virtual Stack (auto Invert)</text>
  <text class="t-sub" x="175" y="863" text-anchor="middle">Right-Click: Align &amp; Display (P2+3)</text>
  <rect class="box" x="335" y="769" width="270" height="144" style="fill:#2d2010;stroke:#e67e22;stroke-width:2;"/>
  <text class="t-bold" x="470" y="795" text-anchor="middle">Workflow 2: 2D Mosaic</text>
  <text class="t-sub" x="470" y="812" text-anchor="middle">(Multiple tiles, single layer)</text>
  <text class="t-sub" x="470" y="846" text-anchor="middle">Pass 1 (2D Montage) + Pass 3</text>
  <text class="t-sub" x="470" y="863" text-anchor="middle">TrakEM2 .xml + Fiji + Export</text>
  <rect class="box" x="630" y="769" width="270" height="144" style="fill:#311615;stroke:#e74c3c;stroke-width:2;"/>
  <text class="t-bold" x="765" y="795" text-anchor="middle">Workflow 3: Mosaic Z-Stack</text>
  <text class="t-sub" x="765" y="812" text-anchor="middle">(Multiple tiles, serial sections)</text>
  <text class="t-sub" x="765" y="846" text-anchor="middle">Pass 1 (2D) + Pass 2 (Z) + Pass 3</text>
  <text class="t-sub" x="765" y="863" text-anchor="middle">TrakEM2 .xml + Fiji + Export</text>
  <rect class="box" x="925" y="769" width="275" height="144" style="fill:#132333;stroke:#58a6ff;stroke-width:2;"/>
  <text class="t-bold" x="1062" y="795" text-anchor="middle">Contextual Package Export</text>
  <text class="t-sub" x="1062" y="812" text-anchor="middle">(Synced + Aligned + Saved .xml)</text>
  <text class="t-sub" x="1062" y="846" text-anchor="middle">Copies images/, mipmaps &amp; logs</text>
  <text class="t-sub" x="1062" y="863" text-anchor="middle">Rewrites portable relative .xml</text>
  <path class="edge" d="M 128 156 L 128 191"/>
  <path class="edge" d="M 128 264 L 128 311"/>
  <rect class="elbl-bg" x="86.0" y="278" width="84.0" height="17" rx="4"/>
