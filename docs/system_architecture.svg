  <path class="edge" d="M 128 388 L 128 441"/>
  <rect class="elbl-bg" x="82.5" y="405" width="91.0" height="17" rx="4"/>
  <text class="elbl" x="128" y="417" text-anchor="middle">Export Copy</text>
