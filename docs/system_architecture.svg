<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="820" viewBox="0 0 1480 820" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <style>
      .bg { fill: #0d1117; }
      .swim { fill: #161b22; stroke: #484f58; stroke-width: 1.5; rx: 6; }
      .swim-blue { fill: #161b22; stroke: #1f6feb; stroke-width: 2; rx: 6; }
      .sub-dash { fill: none; stroke: #484f58; stroke-width: 1.2; stroke-dasharray: 4,3; rx: 4; }
      .sub-in { fill: #1c2128; stroke: #30363d; stroke-width: 1.2; rx: 4; }
      .box { fill: #21262d; stroke: #484f58; stroke-width: 1.3; rx: 6; }
