      .cyl-green { fill: #132e21; stroke: #2ecc71; stroke-width: 1.8; rx: 8; }
      .hdr { fill: #f0f6fc; font-size: 14px; font-weight: 700; }
      .hdr-blue { fill: #58a6ff; font-size: 14px; font-weight: 700; }
      .subhdr { fill: #8b949e; font-size: 12px; font-weight: 600; }
      .t-bold { fill: #f0f6fc; font-size: 12.5px; font-weight: 700; }
      .t-sub { fill: #c9d1d9; font-size: 11px; }
      .edge { fill: none; stroke: #58a6ff; stroke-width: 1.6; marker-end: url(#arrow); }
      .edge-dash { fill: none; stroke: #58a6ff; stroke-width: 1.5; stroke-dasharray: 5,4; marker-end: url(#arrow); }
      .elbl-bg { fill: #0d1117; opacity: 0.92; }
      .elbl { fill: #8b949e; font-size: 10.5px; font-weight: 600; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1480" height="820"/>
  <rect class="swim" x="25" y="25" width="560" height="535" />
  <text class="hdr" x="305" y="47" text-anchor="middle">1. Discovery, Direct Delta Sync &amp; Package Control</text>
  <rect class="sub-dash" x="40" y="68" width="225" height="475" />
  <text class="subhdr" x="152" y="86" text-anchor="middle">Physical Data Transit</text>
  <rect class="box" x="57" y="108" width="190" height="50" />
  <text class="t-bold" x="152" y="129" text-anchor="middle">MAPS Acquisition</text>
  <text class="t-sub" x="152" y="144" text-anchor="middle">(Z-Stack / Mosaic / Mosaic-Z)</text>
  <rect class="cyl-blue" x="72" y="198" width="160" height="68" />
  <text class="t-bold" x="152" y="226" text-anchor="middle">Network Storage</text>
  <text class="t-sub" x="152" y="241" text-anchor="middle">(I:/Maps)</text>
  <rect class="cyl-green" x="72" y="322" width="160" height="72" />
  <text class="t-bold" x="152" y="349" text-anchor="middle">Local Scratch SSD</text>
  <text class="t-sub" x="152" y="364" text-anchor="middle">(D:/&lt;Dataset&gt;) | 30d Clean</text>
  <rect class="box" x="57" y="442" width="190" height="74" />
  <text class="t-bold" x="152" y="462" text-anchor="middle">Portable Export Package</text>
  <text class="t-sub" x="152" y="477" text-anchor="middle">&lt;Pkg&gt;/images/, .xml,</text>
  <text class="t-sub" x="152" y="492" text-anchor="middle">mipmaps &amp; action.log</text>
  <rect class="sub-in" x="285" y="68" width="285" height="475" />
  <text class="subhdr" x="427" y="86" text-anchor="middle">Control, State &amp; Desktop UI</text>
  <rect class="box" x="307" y="108" width="240" height="52" />
  <text class="t-bold" x="427" y="129" text-anchor="middle">nas_indexer.py (--indexer)</text>
  <text class="t-sub" x="427" y="144" text-anchor="middle">Auto-start &amp; version check</text>
  <rect class="box" x="317" y="196" width="220" height="74" />
  <text class="t-bold" x="427" y="217" text-anchor="middle">%APPDATA%/BioEM_Preview/</text>
  <text class="t-sub" x="427" y="232" text-anchor="middle">cache.json, aligned_datasets.json,</text>
  <text class="t-sub" x="427" y="247" text-anchor="middle">dataset_logs/</text>
  <rect class="box" x="302" y="312" width="250" height="72" />
  <text class="t-bold" x="427" y="333" text-anchor="middle">Preview_beta.exe (GUI)</text>
  <text class="t-sub" x="427" y="348" text-anchor="middle">Tiered Badges (Z / Mosaic / Mosaic Z)</text>
  <text class="t-sub" x="427" y="363" text-anchor="middle">Logs Sidebar &amp; Setup Wizard</text>
  <rect class="box" x="302" y="422" width="250" height="94" />
  <text class="t-bold" x="427" y="443" text-anchor="middle">Right-Click Context Actions</text>
  <text class="t-sub" x="427" y="458" text-anchor="middle">Show Folder | Align &amp; Display (Z-Stack)</text>
  <text class="t-sub" x="427" y="473" text-anchor="middle">Export Data Package (Portable .xml)</text>
  <text class="t-sub" x="427" y="488" text-anchor="middle">Refresh Folder | Delete Local Cache</text>
  <rect class="swim-blue" x="615" y="25" width="330" height="535" />
  <text class="hdr-blue" x="780" y="47" text-anchor="middle">2. FEI LUT Inspection &amp; Routing</text>
  <rect class="box" x="640" y="78" width="280" height="72" />
  <text class="t-bold" x="780" y="100" text-anchor="middle">1st TIFF LUT Check (bioem_config.py)</text>
  <text class="t-sub" x="780" y="115" text-anchor="middle">Tag 34682 DigitalContrast:</text>
  <text class="t-sub" x="780" y="130" text-anchor="middle">-1 = Keep LUT | +1 = Invert LUT</text>
  <rect class="box" x="660" y="192" width="240" height="58" />
  <text class="t-bold" x="780" y="216" text-anchor="middle">fiji_trigger.txt</text>
  <text class="t-sub" x="780" y="231" text-anchor="middle">...|z-stack|1|1|invert=0/1</text>
  <rect class="box" x="650" y="290" width="260" height="66" />
  <text class="t-bold" x="780" y="317" text-anchor="middle">BioEM_Watcher.ijm (AutoRun)</text>
  <text class="t-sub" x="780" y="332" text-anchor="middle">Virtual Stack + conditional Invert LUT</text>
  <rect class="box" x="635" y="408" width="290" height="84" />
  <text class="t-bold" x="780" y="433" text-anchor="middle">bioem_engine.py (uv Bootstrap)</text>
  <text class="t-sub" x="780" y="448" text-anchor="middle">Isolated CUDA / CPU PyTorch venv:</text>
  <text class="t-sub" x="780" y="463" text-anchor="middle">%LOCALAPPDATA%/BioEM_Preview/runtime</text>
  <rect class="swim" x="975" y="25" width="480" height="535" />
  <text class="hdr" x="1215" y="47" text-anchor="middle">3. PyTorch GPU/CPU Alignment Engine</text>
  <rect class="box" x="1030" y="75" width="370" height="60" />
  <text class="t-bold" x="1215" y="100" text-anchor="middle">bioem_torch_align.py</text>
  <text class="t-sub" x="1215" y="115" text-anchor="middle">Inspect 1st TIFF DigitalContrast &amp; grid (RxC, z=N)</text>
  <rect class="box" x="1020" y="168" width="390" height="68" />
  <text class="t-bold" x="1215" y="196" text-anchor="middle">Pass 1: 2D Intra-Section Montaging</text>
  <text class="t-sub" x="1215" y="211" text-anchor="middle">Coarse-to-fine FFT phase corr (-dx, -dy) + IRLS/LSQR</text>
  <rect class="box" x="1020" y="268" width="390" height="70" />
  <text class="t-bold" x="1215" y="297" text-anchor="middle">Pass 2: Layer-as-Rigid-Unit Z-Align</text>
  <text class="t-sub" x="1215" y="312" text-anchor="middle">Procrustes RANSAC (align_z_pair_rigid, cumulative)</text>
  <rect class="box" x="1020" y="370" width="390" height="78" />
  <text class="t-bold" x="1215" y="399" text-anchor="middle">Pass 3: Native TrakEM2 XML &amp; Log Save</text>
  <text class="t-sub" x="1215" y="414" text-anchor="middle">filter_enabled/invert, int filter_min/max + dataset_logs/</text>
  <rect class="box" x="1070" y="480" width="290" height="56" />
  <text class="t-bold" x="1215" y="503" text-anchor="middle">Fiji (Java 8) / TrakEM2</text>
  <text class="t-sub" x="1215" y="518" text-anchor="middle">Direct display &amp; interactive inspection</text>
  <rect class="swim" x="25" y="590" width="1430" height="200" />
  <text class="hdr" x="740" y="612" text-anchor="middle">4. Supported Workflows &amp; Contextual Outputs</text>
  <rect class="box" x="50" y="635" width="330" height="132" style="fill:#142b22;stroke:#2ecc71;stroke-width:1.6;"/>
  <text class="t-bold" x="215" y="658" text-anchor="middle">Workflow 1: Z-Stack</text>
  <text class="t-sub" x="215" y="673" text-anchor="middle">(Single tile, serial sections)</text>
  <text class="t-sub" x="215" y="688" text-anchor="middle"></text>
  <text class="t-sub" x="215" y="703" text-anchor="middle">Default: Virtual Stack (auto Invert LUT)</text>
  <text class="t-sub" x="215" y="718" text-anchor="middle">Right-Click: Align &amp; Display (Pass 2 + 3)</text>
  <rect class="box" x="405" y="635" width="330" height="132" style="fill:#2d2010;stroke:#e67e22;stroke-width:1.6;"/>
  <text class="t-bold" x="570" y="658" text-anchor="middle">Workflow 2: 2D Spatial Mosaic</text>
  <text class="t-sub" x="570" y="673" text-anchor="middle">(Multiple tiles, single layer)</text>
  <text class="t-sub" x="570" y="688" text-anchor="middle"></text>
  <text class="t-sub" x="570" y="703" text-anchor="middle">Pass 1 (2D Montage) + Pass 3</text>
  <text class="t-sub" x="570" y="718" text-anchor="middle">TrakEM2 .xml + Fiji + Package Export</text>
  <rect class="box" x="760" y="635" width="330" height="132" style="fill:#311615;stroke:#e74c3c;stroke-width:1.6;"/>
  <text class="t-bold" x="925" y="658" text-anchor="middle">Workflow 3: Mosaic Z-Stack</text>
  <text class="t-sub" x="925" y="673" text-anchor="middle">(Multiple tiles, serial sections)</text>
  <text class="t-sub" x="925" y="688" text-anchor="middle"></text>
  <text class="t-sub" x="925" y="703" text-anchor="middle">Pass 1 (2D) + Pass 2 (Z-Align) + Pass 3</text>
  <text class="t-sub" x="925" y="718" text-anchor="middle">TrakEM2 .xml + Fiji + Package Export</text>
  <rect class="box" x="1115" y="635" width="315" height="132" style="fill:#132333;stroke:#58a6ff;stroke-width:1.6;"/>
  <text class="t-bold" x="1272" y="658" text-anchor="middle">Contextual Package Export</text>
  <text class="t-sub" x="1272" y="673" text-anchor="middle">Requires Sync + Alignment + Saved XML</text>
  <text class="t-sub" x="1272" y="688" text-anchor="middle"></text>
  <text class="t-sub" x="1272" y="703" text-anchor="middle">Copies images/, mipmaps &amp; logs</text>
  <text class="t-sub" x="1272" y="718" text-anchor="middle">Rewrites relative .xml paths portably</text>
