  <rect class="elbl-bg" x="203.0" y="167" width="42.0" height="17" rx="4"/>
  <text class="elbl" x="224" y="179" text-anchor="middle">Scan</text>
  <path class="edge" d="M 337 156 L 337 189"/>
  <path class="edge-dash" d="M 337 268 L 337 305"/>
  <rect class="elbl-bg" x="316.0" y="277" width="42.0" height="17" rx="4"/>
  <text class="elbl" x="337" y="289" text-anchor="middle">Poll</text>
  <path class="edge-dash" d="M 245 351 L 213 351"/>
  <rect class="elbl-bg" x="208.0" y="329" width="42.0" height="17" rx="4"/>
  <text class="elbl" x="229" y="341" text-anchor="middle">Sync</text>
