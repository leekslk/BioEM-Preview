name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      torch_variant:
        description: "PyTorch wheel variant to bundle"
        required: true
        default: "cu118"
        type: choice
        options:
          - cu118
          - cpu

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          $variant = "${{ inputs.torch_variant }}"
          if (-not $variant) { $variant = "cu118" }
          if ($variant -eq "cu118") {
            pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cu118
          } else {
            pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          }
          pip install --no-cache-dir customtkinter psutil numpy scipy tifffile pyinstaller

      - name: Build Preview_beta ZIP
        shell: powershell
        run: .\build_windows_release.ps1

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Preview_beta-windows-${{ inputs.torch_variant || 'cu118' }}
          path: dist/Preview_beta-*.zip

      - name: Attach ZIP to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
          files: dist/Preview_beta-*.zip
