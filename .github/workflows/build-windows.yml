name: Build Windows Beta Release

on:
  workflow_dispatch:
    inputs:
      torch_variant:
        description: "PyTorch wheel variant to bundle"
        required: true
        default: "cu118"
        type: choice
        options:
          - cu118
          - cpu

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if ("${{ inputs.torch_variant }}" -eq "cu118") {
            pip install torch --index-url https://download.pytorch.org/whl/cu118
          } else {
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          }
          pip install customtkinter psutil numpy scipy tifffile pyinstaller

      - name: Build Preview_beta ZIP
        shell: powershell
        run: .\build_windows_release.ps1

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Preview_beta-windows-${{ inputs.torch_variant }}
          path: dist/Preview_beta-*.zip
