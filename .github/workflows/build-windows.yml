name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight build dependencies
        shell: powershell
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir customtkinter psutil pyinstaller

      - name: Build Preview_beta ZIP
        shell: powershell
        run: |
          .\build_windows_release.ps1
          $builtZip = Get-ChildItem -Path "dist\Preview_beta-*.zip" | Where-Object { $_.Name -ne "Preview_beta-win64.zip" } | Select-Object -First 1
          if ($builtZip) {
            Copy-Item -Path $builtZip.FullName -Destination "dist\Preview_beta-win64.zip" -Force
          }

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Preview_beta-windows
          path: dist/Preview_beta-*.zip

      - name: Attach ZIP to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
          files: dist/Preview_beta-*.zip
